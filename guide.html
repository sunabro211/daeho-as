<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>대호AS관리 — 사용 가이드</title>
<meta name="theme-color" content="#1B5E20">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --green:#1B5E20;--green2:#2E7D32;--green4:#E8F5E9;
  --blue:#0D47A1;--blue2:#1565C0;--blue3:#E3F2FD;
  --orange2:#F57C00;--orange3:#FFF3E0;
  --red2:#C62828;--red3:#FFEBEE;
  --gray1:#1A1A1A;--gray2:#424242;--gray3:#757575;--gray4:#BDBDBD;--gray5:#F5F5F5;
}
body{font-family:'Noto Sans KR',sans-serif;background:#ECEFF1;min-height:100vh;-webkit-font-smoothing:antialiased}
header{background:linear-gradient(135deg,#1B5E20,#2E7D32);color:white;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 3px 12px rgba(0,0,0,.3)}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-badge{background:white;border-radius:8px;padding:5px 9px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.logo-daeho{font-size:14px;font-weight:900;color:#1B5E20;letter-spacing:2px}
.logo-co{font-size:7px;font-weight:600;color:#2E7D32;letter-spacing:1px}
.header-text h1{font-size:14px;font-weight:700;margin-left:10px}
.header-text span{font-size:10px;opacity:.8;display:block;margin-left:10px;margin-top:1px}
.role-chip{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:700}
.wrap{max-width:480px;margin:0 auto;padding:16px}
/* 역할 배너 */
.role-banner{border-radius:14px;padding:16px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.role-icon{font-size:32px;flex-shrink:0}
.role-title{font-size:16px;font-weight:900}
.role-sub{font-size:12px;opacity:.75;margin-top:2px}
/* 플로우 */
.flow{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.flow-title{font-size:13px;font-weight:700;color:var(--gray2);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.step{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;position:relative}
.step:not(:last-child)::after{content:'';position:absolute;left:16px;top:36px;width:2px;height:calc(100% - 8px);background:#E0E0E0;border-radius:2px}
.step-num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex-shrink:0;z-index:1}
.step-body{flex:1;padding-top:4px}
.step-label{font-size:13px;font-weight:700;color:var(--gray1);margin-bottom:2px}
.step-desc{font-size:11px;color:var(--gray3);line-height:1.6}
/* 카드 */
.card{background:white;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card-title{font-size:13px;font-weight:700;color:var(--gray2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
/* 팁 */
.tip{border-radius:10px;padding:12px;margin-bottom:10px;font-size:12px;line-height:1.6;display:flex;gap:8px}
.tip-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.tip b{display:block;font-size:12px;font-weight:700;margin-bottom:3px}
/* 상태 배지 */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;margin:2px}
.b-req{background:#FFF3E0;color:#E65100}
.b-wait{background:#E3F2FD;color:#1565C0}
.b-ing{background:#F3E5F5;color:#6A1B9A}
.b-done{background:#E8F5E9;color:#2E7D32}
.b-out{background:#F5F5F5;color:#757575}
/* 버튼 */
.btn-link{display:block;width:100%;padding:14px;background:linear-gradient(135deg,#1B5E20,#2E7D32);color:white;border:none;border-radius:12px;font-size:14px;font-weight:700;text-align:center;text-decoration:none;margin-top:16px;cursor:pointer}
/* 섹션 구분 */
.sec{font-size:11px;font-weight:700;color:var(--gray3);letter-spacing:.5px;margin:16px 0 8px;text-transform:uppercase}
/* 전체 흐름도 */
.flow-diagram{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.fd-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.fd-box{border-radius:8px;padding:8px 10px;font-size:11px;font-weight:700;text-align:center;flex:1;min-width:64px}
.fd-arrow{color:var(--gray4);font-size:14px;flex-shrink:0}
.fd-label{font-size:10px;color:var(--gray3);text-align:center;margin-top:2px}
/* 링크 목록 */
.link-item{background:var(--gray5);border-radius:10px;padding:11px 13px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.link-name{font-size:13px;font-weight:700;color:var(--gray1)}
.link-sub{font-size:11px;color:var(--gray3);margin-top:1px}
.copy-btn{background:var(--green4);color:var(--green2);border:none;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}
/* 없는 역할 */
.no-access{text-align:center;padding:60px 20px}
.no-access .icon{font-size:60px;margin-bottom:16px}
.no-access p{color:var(--gray3);font-size:14px}
footer{text-align:center;padding:20px;font-size:11px;color:var(--gray4)}
</style>
</head>
<body>
<header>
  <div class="logo-wrap">
    <div class="logo-badge">
      <div class="logo-daeho">대호</div>
      <div class="logo-co">주식회사</div>
    </div>
    <div class="header-text">
      <h1>영업부 AS 관리</h1>
      <span>사용 가이드</span>
    </div>
  </div>
  <div class="role-chip" id="role-chip">📖 가이드</div>
</header>

<div class="wrap" id="content">
  <div class="no-access">
    <div class="icon">⏳</div>
    <p>로딩 중...</p>
  </div>
</div>

<footer>Made with ❤️ by <strong style="color:var(--green2)">Suneth수나</strong> · 대호주식회사 영업부</footer>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzYSvJo-ikW86pCOYUxtw_DXxCwopQ6JKSUEiYqLuuYsnZsDU2VfFneaEJPwglkxtdvGw/exec';
const BASE = location.origin + location.pathname.replace('guide.html','');
const ACCESS_KEY = new URLSearchParams(location.search).get('k') || '';

const KEY_ROLE_MAP = {
  'dh-chief-9271':'chief','dh-factory-4853':'factory','dh-admin-7364':'admin',
  'dh-as-2918':'as','dh-t1-5547':'team1','dh-t3-8823':'team3',
  'dh-t4-3391':'team4','dh-t5-6614':'team5','dh-t6-1072':'team6',
  'dh-rd-4429':'teamrd','dh-view-8801':'viewer'
};

const ROLE_META = {
  chief:   {name:'영업부서장', icon:'👔', color:'#1B5E20', bg:'#E8F5E9'},
  factory: {name:'공장장',     icon:'🏭', color:'#1B5E20', bg:'#E8F5E9'},
  admin:   {name:'Suneth (관리자)', icon:'💻', color:'#0D47A1', bg:'#E3F2FD'},
  as:      {name:'AS팀장',     icon:'🔧', color:'#6A1B9A', bg:'#F3E5F5'},
  team1:   {name:'1팀 팀장',   icon:'📋', color:'#E65100', bg:'#FFF3E0'},
  team3:   {name:'3팀 팀장',   icon:'📋', color:'#E65100', bg:'#FFF3E0'},
  team4:   {name:'4팀 팀장',   icon:'📋', color:'#E65100', bg:'#FFF3E0'},
  team5:   {name:'5팀 팀장',   icon:'📋', color:'#E65100', bg:'#FFF3E0'},
  team6:   {name:'6팀 팀장',   icon:'📋', color:'#E65100', bg:'#FFF3E0'},
  teamrd:  {name:'로보드림 팀장',icon:'📋', color:'#E65100', bg:'#FFF3E0'},
  viewer:  {name:'사무실 조회', icon:'👁', color:'#757575', bg:'#F5F5F5'},
  employee:{name:'직원',       icon:'👤', color:'#E65100', bg:'#FFF3E0'},
};

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function copyLink(url){
  if(navigator.clipboard) navigator.clipboard.writeText(url).then(()=>toast('🔗 링크 복사됨!')).catch(()=>toast(url));
  else toast(url);
}

function toast(msg){
  let t = document.getElementById('_toast');
  if(!t){t=document.createElement('div');t.id='_toast';t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999;white-space:nowrap;opacity:0;transition:.3s';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(t._t);t._t=setTimeout(()=>{t.style.opacity='0';},2000);
}

// ── 전체 흐름도 (공통) ──
function flowDiagram(){
  return `
  <div class="flow-diagram">
    <div class="flow-title">🔄 전체 AS 처리 흐름</div>
    <div class="fd-row">
      <div class="fd-box" style="background:#FFF3E0;color:#E65100">📋<br>신청</div>
      <div class="fd-arrow">→</div>
      <div class="fd-box" style="background:#E3F2FD;color:#1565C0">📥<br>입고확정</div>
      <div class="fd-arrow">→</div>
      <div class="fd-box" style="background:#F3E5F5;color:#6A1B9A">🔧<br>AS시작</div>
      <div class="fd-arrow">→</div>
      <div class="fd-box" style="background:#E8F5E9;color:#2E7D32">✅<br>완료</div>
      <div class="fd-arrow">→</div>
      <div class="fd-box" style="background:#F5F5F5;color:#757575">🚚<br>출고</div>
    </div>
    <div style="font-size:11px;color:#757575;margin-top:8px;line-height:1.7">
      📋 <b>신청</b>: 영업팀장이 입고 신청<br>
      📥 <b>입고확정</b>: 관리자/AS팀장이 본사 도착 확인<br>
      🔧 <b>AS시작→완료</b>: AS팀장이 수리 처리<br>
      🚚 <b>출고</b>: 관리자가 출고 처리
    </div>
  </div>`;
}

// ── 역할별 가이드 콘텐츠 ──
function guideForRole(role){
  const isTeam = role.startsWith('team') || role==='employee';

  if(isTeam || role==='employee'){
    const teamName = {team1:'1팀',team3:'3팀',team4:'4팀',team5:'5팀',team6:'6팀',teamrd:'로보드림',employee:'본인 팀'}[role]||'';
    return `
    ${flowDiagram()}
    <div class="card">
      <div class="card-title">📱 주요 화면</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        <span style="background:#E8F5E9;color:#2E7D32;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700">📥 신청</span>
        <span style="background:#E8F5E9;color:#2E7D32;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700">👀 우리팀</span>
        <span style="background:#E8F5E9;color:#2E7D32;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700">📜 전체이력</span>
      </div>
    </div>
    <div class="flow">
      <div class="flow-title">📥 입고 신청 방법</div>
      <div class="step">
        <div class="step-num" style="background:#E8F5E9;color:#2E7D32">1</div>
        <div class="step-body">
          <div class="step-label">QR 스캔 또는 직접 입력</div>
          <div class="step-desc">기계 명판의 QR코드를 스캔하면 기종명·형식명·제조번호가 자동 입력돼요.<br>QR이 없으면 제조번호를 직접 입력하세요 (예: 6R3-0192)</div>
        </div>
      </div>
      <div class="step">
        <div class="step-num" style="background:#E8F5E9;color:#2E7D32">2</div>
        <div class="step-body">
          <div class="step-label">수요자 정보 입력</div>
          <div class="step-desc">수요자명(농가 이름)과 지역을 입력하세요. 나중에 수정도 가능해요.</div>
        </div>
      </div>
      <div class="step">
        <div class="step-num" style="background:#E8F5E9;color:#2E7D32">3</div>
        <div class="step-body">
          <div class="step-label">부품 상태 체크 (선택)</div>
          <div class="step-desc">기계와 함께 오는 부품이 있으면 체크해주세요.</div>
        </div>
      </div>
      <div class="step">
        <div class="step-num" style="background:#E8F5E9;color:#2E7D32">4</div>
        <div class="step-body">
          <div class="step-label">📋 입고 신청하기 버튼 클릭</div>
          <div class="step-desc">신청이 완료되면 관리자와 AS팀장이 확인할 수 있어요.</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">👀 우리팀 탭에서 할 수 있는 것</div>
      <div class="tip" style="background:#E8F5E9">
        <div class="tip-icon">✏️</div>
        <div><b>신청 건 수정</b>수요자명, 지역, 메모를 수정할 수 있어요. <b>신청 상태</b>일 때만 가능해요.</div>
      </div>
      <div class="tip" style="background:#FFEBEE">
        <div class="tip-icon">🗑</div>
        <div><b>신청 건 삭제</b>잘못 입력했을 때 삭제할 수 있어요. <b>신청 상태</b>일 때만 가능하고, 입고 확정 이후에는 관리자에게 요청하세요.</div>
      </div>
      <div class="tip" style="background:#E3F2FD">
        <div class="tip-icon">🧑‍🔧</div>
        <div><b>직원 링크 생성</b>팀원에게 신청 권한을 줄 수 있어요. 이름 입력 후 "직원 링크 생성" 버튼을 누르면 링크가 자동 복사돼요.</div>
      </div>
    </div>
    <div class="tip" style="background:#FFF3E0">
      <div class="tip-icon">⚠️</div>
      <div><b>주의사항</b>입고 확정 이후에는 수정이나 삭제가 불가능해요. 신청 전에 정보를 꼭 확인해주세요.</div>
    </div>
    <a href="index.html?k=${ACCESS_KEY}" class="btn-link">📱 앱으로 이동</a>`;
  }

  if(role==='as'){
    return `
    ${flowDiagram()}
    <div class="card">
      <div class="card-title">📱 주요 화면</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <span style="background:#E8F5E9;color:#2E7D32;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700">📥 입고</span>
        <span style="background:#E8F5E9;color:#2E7D32;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700">⏳ AS대기</span>
        <span style="background:#E8F5E9;color:#2E7D32;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700">🔧 진행중</span>
        <span style="background:#E8F5E9;color:#2E7D32;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700">✅ 완료</span>
        <span style="background:#E8F5E9;color:#2E7D32;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700">📜 전체이력</span>
      </div>
    </div>
    <div class="flow">
      <div class="flow-title">🔧 AS 처리 순서</div>
      <div class="step">
        <div class="step-num" style="background:#F3E5F5;color:#6A1B9A">1</div>
        <div class="step-body">
          <div class="step-label">📥 입고 탭 — 입고 확정</div>
          <div class="step-desc">영업팀이 신청한 기계가 본사에 도착하면, <b>신청</b> 상태 항목의 "📥 입고 확정" 버튼을 눌러주세요. 함께 온 부품도 체크해주세요.</div>
        </div>
      </div>
      <div class="step">
        <div class="step-num" style="background:#F3E5F5;color:#6A1B9A">2</div>

      </div>

        <div class="step-num" style="background:#F3E5F5;color:#6A1B9A">3</div>

        </div>
      </div>
      <div class="step">
        <div class="step-num" style="background:#F3E5F5;color:#6A1B9A">4</div>
        <div class="step-body">
          <div class="step-label">✅ AS 완료 처리</div>
          <div class="step-desc">"✅ AS 완료 처리" 버튼을 눌러 고장 내용, 수리 내역, 사용 부품을 최종 입력해주세요.</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">📝 누락 정보 입력</div>
      <div class="tip" style="background:#F3E5F5">
        <div class="tip-icon">📝</div>
        <div>영업팀이 정보를 빠뜨리고 신청했을 때, <b>"📝 정보입력"</b> 버튼으로 기종명·형식명·영업팀·수요자명을 직접 입력할 수 있어요. 이미 입력된 항목은 덮어쓰지 않아요.</div>
      </div>
    </div>
    <div class="tip" style="background:#FFF3E0">
      <div class="tip-icon">⚠️</div>
      <div><b>주의</b>AS 완료 후 출고는 관리자(Suneth)가 처리해요. 완료 탭에서 확인 가능해요.</div>
    </div>
    <a href="index.html?k=${ACCESS_KEY}" class="btn-link">📱 앱으로 이동</a>`;
  }

  if(role==='chief' || role==='factory' || role==='admin'){
    const isFactory = role==='factory';
    const isAdmin = role==='admin';
    return `
    ${flowDiagram()}
    <div class="card">

// ── 초기화 ──
async function init(){
  let role = KEY_ROLE_MAP[ACCESS_KEY];
  let name = '';

  if(!role && ACCESS_KEY){
    try{
      const res = await fetch(`${API}?action=whoami&k=${ACCESS_KEY}`);
      const json = await res.json();
      if(json.success){ role='employee'; name=json.name||'직원'; }
    }catch(e){}
  }

  if(!role){
    document.getElementById('content').innerHTML = `<div class="no-access"><div class="icon">🔒</div><p>올바른 링크로 접속해주세요</p></div>`;
    return;
  }

  const meta = ROLE_META[role] || {name:'사용자',icon:'👤',color:'#424242',bg:'#F5F5F5'};
  const displayName = name || meta.name;

  document.getElementById('role-chip').textContent = meta.icon+' '+displayName;
  document.title = `대호AS 가이드 — ${displayName}`;

  const isAdminRole = role==='admin'||role==='chief'||role==='factory';

  document.getElementById('content').innerHTML = `
    <div class="role-banner" style="background:${meta.bg};border:2px solid ${meta.color}20">
      <div class="role-icon">${meta.icon}</div>
      <div>
        <div class="role-title" style="color:${meta.color}">${esc(displayName)}</div>
        <div class="role-sub" style="color:${meta.color}">대호주식회사 영업부 AS 관리시스템</div>
      </div>
    </div>
    ${guideForRole(role)}
    ${isAdminRole ? adminLinkList() : ''}
  `;
}

init();
</script>
