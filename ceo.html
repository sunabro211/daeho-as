<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>대호주식회사 — AS 현황 대시보드</title>
<meta name="theme-color" content="#1B5E20">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --green:#1B5E20;--green2:#2E7D32;--green3:#43A047;--green4:#E8F5E9;
  --blue:#0D47A1;--blue2:#1565C0;--blue3:#E3F2FD;
  --orange:#E65100;--orange2:#F57C00;--orange3:#FFF3E0;
  --red:#B71C1C;--red2:#C62828;--red3:#FFEBEE;
  --gold:#F9A825;--gold2:#FFF8E1;
  --gray1:#1A1A1A;--gray2:#424242;--gray3:#757575;--gray4:#BDBDBD;--gray5:#F5F5F5;
}
body{font-family:'Noto Sans KR',sans-serif;background:#ECEFF1;min-height:100vh;-webkit-font-smoothing:antialiased}

/* ── 헤더 ── */
header{background:linear-gradient(135deg,#1B5E20 0%,#2E7D32 60%,#388E3C 100%);color:white;padding:14px 16px;position:sticky;top:0;z-index:100;box-shadow:0 3px 12px rgba(0,0,0,.3)}
.hdr{display:flex;align-items:center;justify-content:space-between}
.logo-badge{background:white;border-radius:8px;padding:5px 9px;display:flex;flex-direction:column;align-items:center;line-height:1.1;flex-shrink:0}
.logo-daeho{font-size:14px;font-weight:900;color:#1B5E20;letter-spacing:2px}
.logo-co{font-size:7px;font-weight:600;color:#2E7D32;letter-spacing:1px}
.hdr-mid{flex:1;margin-left:10px}
.hdr-mid h1{font-size:15px;font-weight:700}
.hdr-mid span{font-size:10px;opacity:.8;display:block;margin-top:1px}
.hdr-right{font-size:10px;opacity:.7;text-align:right;flex-shrink:0}
#last-updated{display:block;font-size:9px;opacity:.6;margin-top:2px}

/* ── 레이아웃 ── */
.wrap{max-width:480px;margin:0 auto;padding:14px}

/* ── 새로고침 버튼 ── */
.refresh-bar{display:flex;justify-content:flex-end;margin-bottom:10px}
.refresh-btn{background:white;border:1.5px solid #E0E0E0;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--green2);cursor:pointer;display:flex;align-items:center;gap:5px}

/* ── 카드 ── */
.card{background:white;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.card-title{font-size:12px;font-weight:700;color:var(--gray3);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.card-title span{font-size:11px;color:var(--gray4);font-weight:400}

/* ── 핵심 지표 그리드 ── */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{border-radius:12px;padding:14px;text-align:center}
.kpi-num{font-size:36px;font-weight:900;line-height:1}
.kpi-lbl{font-size:11px;margin-top:5px;font-weight:600;opacity:.75}
.kpi-sub{font-size:10px;opacity:.55;margin-top:2px}
.kpi-g{background:linear-gradient(135deg,#1B5E20,#2E7D32);color:white}
.kpi-b{background:linear-gradient(135deg,#0D47A1,#1565C0);color:white}
.kpi-o{background:linear-gradient(135deg,#E65100,#F57C00);color:white}
.kpi-p{background:linear-gradient(135deg,#6A1B9A,#8E24AA);color:white}
.kpi-gold{background:linear-gradient(135deg,#F57F17,#F9A825);color:white}
.kpi-gray{background:var(--gray5);color:var(--gray2)}

/* ── 바 차트 ── */
.bar-row{margin-bottom:10px}
.bar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.bar-label b{font-weight:700;color:var(--gray1)}
.bar-label span{font-weight:700;color:var(--green2)}
.bar-track{background:#E8F5E9;border-radius:20px;height:10px;overflow:hidden}
.bar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#2E7D32,#43A047);transition:width 1s cubic-bezier(.4,0,.2,1)}
.bar-track.b .bar-fill{background:linear-gradient(90deg,#1565C0,#1976D2)}
.bar-track.o .bar-fill{background:linear-gradient(90deg,#E65100,#F57C00)}
.bar-track.p .bar-fill{background:linear-gradient(90deg,#6A1B9A,#8E24AA)}
.bar-track.gold .bar-fill{background:linear-gradient(90deg,#F57F17,#F9A825)}
.bar-track.r .bar-fill{background:linear-gradient(90deg,#C62828,#E53935)}

/* ── 상태별 파이 (도넛) ── */
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut-svg{flex-shrink:0}
.donut-legend{flex:1}
.legend-item{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.legend-label{font-size:12px;color:var(--gray2);flex:1}
.legend-val{font-size:13px;font-weight:700;color:var(--gray1)}

/* ── 팀별 순위 ── */
.rank-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F0F0F0}
.rank-item:last-child{border-bottom:none}
.rank-num{width:24px;height:24px;border-radius:50%;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rank-body{flex:1}
.rank-name{font-size:13px;font-weight:700;color:var(--gray1)}
.rank-bar-row{display:flex;align-items:center;gap:6px;margin-top:4px}
.rank-mini-bar{flex:1;height:6px;background:#E8F5E9;border-radius:10px;overflow:hidden}
.rank-mini-fill{height:100%;border-radius:10px;background:var(--green3);transition:width 1s}
.rank-count{font-size:12px;font-weight:700;color:var(--green2);min-width:24px;text-align:right}
.rank-badge{font-size:10px;padding:2px 7px;border-radius:10px;background:var(--orange3);color:var(--orange);font-weight:700}

/* ── 긴급 알림 ── */
.urgent-banner{background:linear-gradient(135deg,#B71C1C,#C62828);color:white;border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.urgent-banner .icon{font-size:24px;flex-shrink:0}
.urgent-banner b{font-size:14px;font-weight:900;display:block}
.urgent-banner span{font-size:11px;opacity:.85}

/* ── 장기 미처리 알림 ── */
.delay-item{background:#FFF3E0;border-radius:10px;padding:10px 12px;margin-bottom:8px;border-left:4px solid var(--orange2)}
.delay-serial{font-size:13px;font-weight:700;color:var(--gray1)}
.delay-info{font-size:11px;color:var(--gray3);margin-top:2px}
.delay-days{font-size:20px;font-weight:900;color:var(--orange);float:right;margin-top:-2px}

/* ── 섹션 라벨 ── */
.sec{font-size:11px;font-weight:700;color:var(--gray3);letter-spacing:.5px;margin:14px 0 8px}

/* ── 월별 추이 ── */
.monthly-row{display:flex;align-items:flex-end;gap:4px;height:80px;margin-bottom:6px}
.month-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.month-bar-wrap{flex:1;width:100%;display:flex;align-items:flex-end}
.month-bar{width:100%;border-radius:4px 4px 0 0;background:var(--green3);min-height:3px;transition:height 1s}
.month-label{font-size:9px;color:var(--gray4);white-space:nowrap}
.month-val{font-size:10px;font-weight:700;color:var(--green2)}

/* ── 로딩 ── */
.loading{text-align:center;padding:40px 20px;color:var(--gray4)}
.spinner{width:32px;height:32px;border:3px solid #E8F5E9;border-top-color:var(--green2);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 잠금 ── */
.locked{text-align:center;padding:60px 20px}
.locked .icon{font-size:60px;margin-bottom:16px}
.locked p{color:var(--gray3);font-size:14px}

footer{text-align:center;padding:20px;font-size:11px;color:var(--gray4)}
</style>
</head>
<body>
<header>
  <div class="hdr">
    <div class="logo-badge">
      <div class="logo-daeho">대호</div>
      <div class="logo-co">주식회사</div>
    </div>
    <div class="hdr-mid">
      <h1>영업부 AS 현황</h1>
      <span>실시간 대시보드</span>
    </div>
    <div class="hdr-right">
      <span id="today-date"></span>
      <span id="last-updated"></span>
    </div>
  </div>
</header>

<div class="wrap" id="wrap">
  <div class="loading">
    <div class="spinner"></div>
    <p>데이터 불러오는 중...</p>
  </div>
</div>

<footer>Made with ❤️ by <strong style="color:var(--green2)">Suneth수나</strong> · 대호주식회사 영업부</footer>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzYSvJo-ikW86pCOYUxtw_DXxCwopQ6JKSUEiYqLuuYsnZsDU2VfFneaEJPwglkxtdvGw/exec';
// 프론트엔드에서 허용하는 키 목록 (추가 보안층)
const ALLOWED_KEYS = [
  'dh-ceo-1119',    // 사장님 전용
  'dh-chief-9271',  // 영업부서장
  'dh-factory-4853',// 공장장
  'dh-admin-7364',  // 관리자
];
const ACCESS_KEY = new URLSearchParams(location.search).get('k') || '';

// 날짜 표시
const now = new Date();
document.getElementById('today-date').textContent =
  now.getFullYear()+'년 '+(now.getMonth()+1)+'월 '+now.getDate()+'일';

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function fmt(v){
  if(!v) return '-';
  const d = new Date(v);
  if(isNaN(d)) return '-';
  return (d.getMonth()+1)+'/'+ d.getDate()+' '+
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

function daysSince(dateStr){
  if(!dateStr) return 0;
  const d = new Date(dateStr);
  if(isNaN(d)) return 0;
  return Math.floor((Date.now()-d)/(1000*60*60*24));
}

function donutSVG(segments, size=100){
  const cx=size/2, cy=size/2, r=size*0.35, stroke=size*0.14;
  const circ=2*Math.PI*r;
  const total=segments.reduce((s,seg)=>s+seg.val,0)||1;
  let offset=0;
  let paths='';
  for(const seg of segments){
    const pct=seg.val/total;
    const dash=pct*circ;
    paths+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${stroke}" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset+=dash;
  }
  return `<svg width="${size}" height="${size}" class="donut-svg">${paths}
    <text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="${size*0.18}" font-weight="900" fill="#1A1A1A">${total}</text>
    <text x="${cx}" y="${cy+5+size*0.12}" text-anchor="middle" font-size="${size*0.1}" fill="#757575">전체</text>
  </svg>`;
}

function barRow(label, val, max, cls='', sub=''){
  const pct = max>0 ? Math.round(val/max*100) : 0;
  return `<div class="bar-row">
    <div class="bar-label"><b>${esc(label)}</b><span>${val}건${sub?' ('+sub+')':''}</span></div>
    <div class="bar-track ${cls}"><div class="bar-fill" style="width:${pct}%"></div></div>
  </div>`;
}

async function loadAndRender(){
  document.getElementById('wrap').innerHTML = `<div class="loading"><div class="spinner"></div><p>데이터 불러오는 중...</p></div>`;

  let allData=[], stats={};
  try{
    const [r1,r2] = await Promise.all([
      fetch(`${API}?action=getAll&k=${ACCESS_KEY}`).then(r=>r.json()),
      fetch(`${API}?action=getStats&k=${ACCESS_KEY}`).then(r=>r.json()),
    ]);
    if(!r1.success) throw new Error(r1.error||'데이터 오류');
    allData = r1.data||[];
    stats = r2.success ? r2 : {};
  }catch(e){
    document.getElementById('wrap').innerHTML=`<div class="locked"><div class="icon">⚠️</div><p>${esc(e.message)}</p></div>`;
    return;
  }

  document.getElementById('last-updated').textContent = '업데이트: '+
    String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');

  // ── 상태 집계 ──
  const byStatus = stats.byStatus||{};
  const total     = allData.length;
  const 신청건  = byStatus['신청']||0;
  const 대기건  = byStatus['대기']||0;
  const 진행건  = byStatus['AS중']||0;
  const 완료건  = byStatus['완료']||0;
  const 출고건  = byStatus['출고']||0;
  const inProgress = 신청건+대기건+진행건;

  // ── 이번달 ──
  const thisMonth = now.getMonth(), thisYear = now.getFullYear();
  const monthData = allData.filter(r=>{
    if(!r['신청일시']) return false;
    const d=new Date(r['신청일시']);
    return d.getMonth()===thisMonth && d.getFullYear()===thisYear;
  });
  const monthOut = monthData.filter(r=>r['상태']==='출고').length;

  // ── 긴급 건 ──
  const urgents = allData.filter(r=>r['긴급여부']==='Y'&&r['상태']!=='출고');

  // ── 장기 미처리 (입고 후 7일 이상) ──
  const delays = allData
    .filter(r=>r['상태']==='대기'||r['상태']==='AS중')
    .map(r=>({...r, days:daysSince(r['입고일시'])}))
    .filter(r=>r.days>=7)
    .sort((a,b)=>b.days-a.days)
    .slice(0,5);

  // ── 팀별 집계 ──
  const byTeam = stats.byTeam||{};
  const teamList = Object.entries(byTeam).sort((a,b)=>b[1]-a[1]);
  const maxTeam  = teamList.length ? teamList[0][1] : 1;

  // ── 고장부위 집계 ──
  const byZone = stats.byZone||{};
  const zoneList = Object.entries(byZone).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxZone  = zoneList.length ? zoneList[0][1] : 1;

  // ── 월별 추이 (최근 6개월) ──
  const monthly = {};
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const key=(d.getMonth()+1)+'월';
    monthly[key]=0;
  }
  allData.forEach(r=>{
    if(!r['신청일시']) return;
    const d=new Date(r['신청일시']);
    if((now-d)/(1000*24*3600*30)>6) return;
    const key=(d.getMonth()+1)+'월';
    if(monthly[key]!==undefined) monthly[key]++;
  });
  const monthlyEntries=Object.entries(monthly);
  const maxM=Math.max(...monthlyEntries.map(e=>e[1]),1);

  // ── 평균 소요일 ──
  const avgDays = stats.avgDays||0;

  // ── 색상 팔레트 (팀) ──
  const teamColors=['#2E7D32','#1565C0','#6A1B9A','#E65100','#F57F17','#C62828','#00796B'];

  // ── 도넛 세그먼트 ──
  const donutSegs=[
    {val:신청건,  color:'#FFA726', label:'신청'},
    {val:대기건,  color:'#42A5F5', label:'AS대기'},
    {val:진행건,  color:'#AB47BC', label:'AS중'},
    {val:완료건,  color:'#66BB6A', label:'완료'},
    {val:출고건,  color:'#BDBDBD', label:'출고'},
  ].filter(s=>s.val>0);

  // ── HTML 렌더링 ──
  let html = '';

  // 긴급 알림
  if(urgents.length){
    html+=`<div class="urgent-banner">
      <div class="icon">🚨</div>
      <div><b>긴급 AS ${urgents.length}건 처리 중</b><span>${urgents.map(r=>esc(r['제조번호'])).join(' · ')}</span></div>
    </div>`;
  }

  // 새로고침
  html+=`<div class="refresh-bar">
    <button class="refresh-btn" onclick="loadAndRender()">🔄 새로고침</button>
  </div>`;

  // KPI
  html+=`<div class="kpi-grid">
    <div class="kpi kpi-g">
      <div class="kpi-num">${inProgress}</div>
      <div class="kpi-lbl">🔧 처리 중</div>
      <div class="kpi-sub">신청+대기+진행</div>
    </div>
    <div class="kpi kpi-b">
      <div class="kpi-num">${total}</div>
      <div class="kpi-lbl">📋 전체 AS</div>
      <div class="kpi-sub">누적 건수</div>
    </div>
    <div class="kpi kpi-o">
      <div class="kpi-num">${monthData.length}</div>
      <div class="kpi-lbl">📅 이번달 신청</div>
      <div class="kpi-sub">출고 ${monthOut}건 완료</div>
    </div>
    <div class="kpi kpi-gold">
      <div class="kpi-num">${avgDays}</div>
      <div class="kpi-lbl">⏱ 평균 소요일</div>
      <div class="kpi-sub">입고→출고 기준</div>
    </div>
  </div>`;

  // 상태 분포
  html+=`<div class="card">
    <div class="card-title">📊 현재 상태 분포 <span>전체 ${total}건</span></div>
    <div class="donut-wrap">
      ${donutSVG(donutSegs, 110)}
      <div class="donut-legend">
        ${donutSegs.map(s=>`
        <div class="legend-item">
          <div class="legend-dot" style="background:${s.color}"></div>
          <div class="legend-label">${s.label}</div>
          <div class="legend-val">${s.val}건</div>
        </div>`).join('')}
      </div>
    </div>
  </div>`;

  // 팀별 AS 건수
  if(teamList.length){
    html+=`<div class="card">
      <div class="card-title">👥 영업팀별 AS 건수 <span>총 ${total}건</span></div>
      ${teamList.map(([name,cnt],i)=>`
      <div class="rank-item">
        <div class="rank-num" style="background:${teamColors[i%teamColors.length]}20;color:${teamColors[i%teamColors.length]}">${i+1}</div>
        <div class="rank-body">
          <div style="display:flex;align-items:center;gap:6px">
            <div class="rank-name">${esc(name)}</div>
            ${i===0?`<span class="rank-badge">🏆 최다</span>`:''}
          </div>
          <div class="rank-bar-row">
            <div class="rank-mini-bar"><div class="rank-mini-fill" style="width:${Math.round(cnt/maxTeam*100)}%;background:${teamColors[i%teamColors.length]}"></div></div>
            <div class="rank-count" style="color:${teamColors[i%teamColors.length]}">${cnt}</div>
          </div>
        </div>
      </div>`).join('')}
    </div>`;
  }

  // 고장 부위 TOP6
  if(zoneList.length){
    const zoneColors=['b','p','o','gold','r',''];
    html+=`<div class="card">
      <div class="card-title">🎯 고장 부위 TOP ${zoneList.length}</div>
      ${zoneList.map(([zone,cnt],i)=>barRow(zone,cnt,maxZone,zoneColors[i]||'')).join('')}
    </div>`;
  }

  // 월별 추이
  html+=`<div class="card">
    <div class="card-title">📈 월별 AS 신청 추이</div>
    <div class="monthly-row">
      ${monthlyEntries.map(([label,cnt])=>`
      <div class="month-col">
        <div class="month-val">${cnt||''}</div>
        <div class="month-bar-wrap"><div class="month-bar" style="height:${maxM>0?Math.round(cnt/maxM*100):0}%;background:${cnt===maxM&&cnt>0?'var(--green2)':'var(--green3)'}"></div></div>
        <div class="month-label">${label}</div>
      </div>`).join('')}
    </div>
  </div>`;

  // 장기 미처리
  if(delays.length){
    html+=`<div class="sec">⚠️ 장기 미처리 (입고 후 7일 이상)</div>`;
    delays.forEach(r=>{
      html+=`<div class="delay-item">
        <div class="delay-days">${r.days}일</div>
        <div class="delay-serial">🔖 ${esc(r['제조번호'])} — ${esc(r['기종명']||'')} ${esc(r['형식명']||'')}</div>
        <div class="delay-info">
          ${r['영업팀']?esc(r['영업팀'])+' · ':''}${r['수요자명']?esc(r['수요자명'])+' · ':''}상태: <b>${esc(r['상태'])}</b>
        </div>
      </div>`;
    });
  }

  // 현황 요약 카드
  html+=`<div class="card" style="background:linear-gradient(135deg,#1B5E20,#2E7D32);color:white;margin-top:4px">
    <div style="font-size:13px;font-weight:700;opacity:.85;margin-bottom:14px">📋 현황 요약</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center">
      <div style="background:rgba(255,255,255,.12);border-radius:10px;padding:12px">
        <div style="font-size:24px;font-weight:900">${신청건}</div>
        <div style="font-size:10px;opacity:.8;margin-top:3px">📋 입고 전</div>
      </div>
      <div style="background:rgba(255,255,255,.12);border-radius:10px;padding:12px">
        <div style="font-size:24px;font-weight:900">${대기건}</div>
        <div style="font-size:10px;opacity:.8;margin-top:3px">⏳ AS 대기</div>
      </div>
      <div style="background:rgba(255,255,255,.12);border-radius:10px;padding:12px">
        <div style="font-size:24px;font-weight:900">${진행건}</div>
        <div style="font-size:10px;opacity:.8;margin-top:3px">🔧 수리중</div>
      </div>
      <div style="background:rgba(255,255,255,.1);border-radius:10px;padding:10px">
        <div style="font-size:20px;font-weight:900">${완료건}</div>
        <div style="font-size:10px;opacity:.75;margin-top:3px">✅ 출고 전</div>
      </div>
      <div style="background:rgba(255,255,255,.1);border-radius:10px;padding:10px">
        <div style="font-size:20px;font-weight:900">${출고건}</div>
        <div style="font-size:10px;opacity:.75;margin-top:3px">🚚 출고완료</div>
      </div>
      <div style="background:rgba(255,255,255,.1);border-radius:10px;padding:10px">
        <div style="font-size:20px;font-weight:900">${urgents.length}</div>
        <div style="font-size:10px;opacity:.75;margin-top:3px">🚨 긴급</div>
      </div>
    </div>
  </div>`;

  document.getElementById('wrap').innerHTML = html;
}

async function init(){
  if(!ACCESS_KEY){
    document.getElementById('wrap').innerHTML=`<div class="locked"><div class="icon">🔒</div><p>링크에 접근 키가 없습니다<br><small style="font-size:11px;color:var(--gray4)">?k= 파라미터를 확인해주세요</small></p></div>`;
    return;
  }

  // 프론트 허용 키 목록 + API whoami 이중 체크
  let allowed = false;
  if(ALLOWED_KEYS.includes(ACCESS_KEY)){
    allowed = true;
  } else {
    // 허용 키 목록에 없어도 API에서 admin급 역할이면 허용
    try {
      const res = await fetch(`${API}?action=whoami&k=${ACCESS_KEY}`);
      const json = await res.json();
      if(json.success && ['chief','factory','admin'].includes(json.role)) allowed = true;
    } catch(e){}
  }

  if(!allowed){
    document.getElementById('wrap').innerHTML=`<div class="locked"><div class="icon">🔒</div><p>접근 권한이 없습니다<br><small style="font-size:11px;color:var(--gray4)">부서장·공장장·관리자 계정으로 접속하세요</small></p></div>`;
    return;
  }

  await loadAndRender();
  // 5분마다 자동 갱신
  setInterval(loadAndRender, 5*60*1000);
}

init();
</script>
</body>
</html>
