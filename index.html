<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>대호AS관리</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="대호AS관리">
<meta name="theme-color" content="#1B5E20">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --green:#1B5E20;--green2:#2E7D32;--green3:#43A047;--green4:#E8F5E9;
  --blue:#0D47A1;--blue2:#1565C0;--blue3:#E3F2FD;
  --orange:#E65100;--orange2:#F57C00;--orange3:#FFF3E0;
  --red:#B71C1C;--red2:#C62828;--red3:#FFEBEE;
  --gold:#F57F17;--gold2:#FFF8E1;
  --gray1:#1A1A1A;--gray2:#424242;--gray3:#757575;--gray4:#BDBDBD;--gray5:#F5F5F5;--gray6:#FAFAFA;
}
body{font-family:'Noto Sans KR',sans-serif;background:#ECEFF1;min-height:100vh;display:flex;flex-direction:column;align-items:center}

/* ── 헤더 ── */
header{width:100%;background:linear-gradient(135deg,#1B5E20 0%,#2E7D32 60%,#388E3C 100%);color:white;padding:0 16px;box-shadow:0 3px 12px rgba(0,0,0,.3);position:sticky;top:0;z-index:100}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:10px 0 6px}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-badge{background:white;border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.logo-daeho{font-size:15px;font-weight:900;color:#1B5E20;letter-spacing:2px}
.logo-co{font-size:8px;font-weight:600;color:#2E7D32;letter-spacing:1px}
.header-title h1{font-size:15px;font-weight:700;margin-left:10px}
.header-title span{font-size:10px;opacity:.8;display:block;margin-left:10px;margin-top:1px}
.role-chip{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px}
.online-dot{width:7px;height:7px;border-radius:50%;background:#69F0AE;box-shadow:0 0 6px #69F0AE}

/* ── 탭 ── */
.tabs{width:100%;background:white;display:flex;border-bottom:2px solid #E0E0E0;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.tab{flex:1;padding:10px 2px;text-align:center;font-size:10px;font-weight:600;color:var(--gray3);cursor:pointer;border-bottom:3px solid transparent;transition:.2s;position:relative;user-select:none}
.tab.active{color:var(--green2);border-bottom-color:var(--green2);font-weight:800}
.tab-icon{font-size:17px;display:block;margin-bottom:2px}
.nbadge{position:absolute;top:5px;right:calc(50% - 20px);background:var(--red2);color:white;font-size:9px;font-weight:800;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.nbadge.blue{background:var(--blue2)}

/* ── 컨텐츠 ── */
.content{width:100%;max-width:480px;padding:14px;flex:1}
.screen{display:none}.screen.active{display:block}

/* ── 카드 ── */
.card{background:white;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.07);padding:15px;margin-bottom:12px}
.card-title{font-size:13px;font-weight:700;color:var(--gray2);margin-bottom:12px;display:flex;align-items:center;gap:6px}

/* ── 입력 ── */
.ig{margin-bottom:10px}
.ig label{font-size:12px;font-weight:600;color:var(--gray2);display:block;margin-bottom:4px}
.opt{font-weight:400;color:var(--gray4);font-size:11px}
.ig input,.ig select,.ig textarea{width:100%;padding:10px 13px;border:1.5px solid #E0E0E0;border-radius:10px;font-size:14px;font-family:inherit;outline:none;transition:.2s;background:white;-webkit-appearance:none}
.ig input:focus,.ig select:focus,.ig textarea:focus{border-color:var(--green2);box-shadow:0 0 0 3px rgba(46,125,50,.1)}
.ig textarea{resize:none;line-height:1.6}
.row{display:flex;gap:8px}.row .ig{flex:1}

/* ── 버튼 ── */
.btn{width:100%;padding:13px;border:none;border-radius:11px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition:.15s;letter-spacing:-.2px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn:last-child{margin-bottom:0}
.btn:active{transform:scale(.97)}
.btn-green{background:var(--green2);color:white}
.btn-blue{background:var(--blue2);color:white}
.btn-orange{background:var(--orange2);color:white}
.btn-red{background:var(--red2);color:white}
.btn-outline{background:white;color:var(--green2);border:2px solid var(--green2);padding:11px;font-size:13px}
.btn-sm{padding:7px 13px;border-radius:8px;border:none;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer}
.btn-sm.g{background:var(--green4);color:var(--green2)}
.btn-sm.o{background:var(--orange3);color:var(--orange)}
.btn-sm.b{background:var(--blue3);color:var(--blue2)}
.btn-sm.r{background:var(--red3);color:var(--red2)}

/* ── 상태 배지 ── */
.status{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700}
.s-req{background:#F3E5F5;color:#6A1B9A}
.s-wait{background:var(--orange3);color:var(--orange)}
.s-ing{background:var(--blue3);color:var(--blue2)}
.s-done{background:var(--green4);color:var(--green2)}
.s-out{background:#F5F5F5;color:var(--gray3)}
.urgent-tag{background:var(--red3);color:var(--red2);font-size:10px;font-weight:800;padding:2px 7px;border-radius:10px}
.revisit-tag{background:var(--orange3);color:var(--orange);font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}

/* ── QR박스 ── */
.qr-box{background:var(--gray5);border:2px dashed var(--gray4);border-radius:14px;padding:22px;text-align:center;cursor:pointer;transition:.2s;margin-bottom:12px}
.qr-box:active{border-color:var(--green3);background:var(--green4)}
.qr-icon{font-size:44px;margin-bottom:6px}
.divider{text-align:center;color:var(--gray4);font-size:11px;margin:10px 0;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:#E0E0E0}
.divider::before{left:0}.divider::after{right:0}

/* ── 리스트 아이템 ── */
.li{background:white;border-radius:12px;box-shadow:0 1px 5px rgba(0,0,0,.07);padding:13px;margin-bottom:9px;transition:.15s}
.li:active{transform:scale(.98)}
.li.urgent{border-left:4px solid var(--red2)}
.li-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:5px}
.li-model{font-size:14px;font-weight:700;color:var(--gray1)}
.li-serial{font-size:11px;color:var(--gray3);margin:2px 0}
.li-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.team-tag{background:var(--blue3);color:var(--blue2);font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
.num-circle{width:30px;height:30px;border-radius:50%;background:var(--green4);color:var(--green2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex-shrink:0;margin-right:10px}
.li-inner{display:flex;align-items:center}
.li-time{font-size:10px;color:var(--gray4);text-align:right;flex-shrink:0}

/* ── 부품 체크 ── */
.parts-box{background:var(--gray6);border-radius:10px;padding:12px;margin:8px 0;width:100%;overflow:hidden}
.part-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #EEEEEE;width:100%;overflow:hidden}
.part-item:last-child{border-bottom:none}
.part-cb{width:20px;height:20px;min-width:20px;max-width:20px;accent-color:var(--green2);cursor:pointer;flex-shrink:0}
.part-name{font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.add-part-row{display:flex;gap:6px;margin-top:8px}
.add-part-row input{flex:1;padding:8px 10px;border:1.5px solid #E0E0E0;border-radius:8px;font-size:13px;font-family:inherit;outline:none}
.add-part-row input:focus{border-color:var(--green2)}
.add-part-row button{padding:8px 14px;background:var(--green2);color:white;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}

/* ── 사용부품 수량 ── */
.used-part-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #EEEEEE}
.used-part-item:last-child{border-bottom:none}
.qty-btn{width:26px;height:26px;border:none;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}
.qty-minus{background:#E0E0E0;color:var(--gray2)}
.qty-plus{background:var(--green4);color:var(--green2)}
.qty-num{font-size:14px;font-weight:700;min-width:24px;text-align:center}

/* ── 통계 ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.stat-box{background:white;border-radius:12px;padding:13px;box-shadow:0 1px 5px rgba(0,0,0,.07);text-align:center}
.stat-num{font-size:26px;font-weight:900}
.stat-lbl{font-size:10px;color:var(--gray3);margin-top:2px}
.stat-box.g .stat-num{color:var(--green2)}
.stat-box.b .stat-num{color:var(--blue2)}
.stat-box.o .stat-num{color:var(--orange2)}
.stat-box.r .stat-num{color:var(--red2)}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-label{font-size:12px;color:var(--gray2);width:65px;flex-shrink:0}
.bar-track{flex:1;background:#F0F0F0;border-radius:10px;height:18px;overflow:hidden}
.bar-fill{height:100%;border-radius:10px;display:flex;align-items:center;padding-left:8px;font-size:10px;font-weight:700;color:white;min-width:30px;transition:.6s}
.bar-count{font-size:11px;color:var(--gray3);width:24px;text-align:right}

/* ── 이력 ── */
.history-box{background:var(--gray6);border-radius:12px;padding:12px;margin-top:10px}
.history-item{background:white;border-radius:10px;padding:11px;margin-bottom:8px;border-left:3px solid var(--green3)}
.history-item:last-child{margin-bottom:0}
.history-date{font-size:11px;color:var(--gray3);margin-bottom:3px}
.history-content{font-size:13px;font-weight:600}
.history-detail{font-size:11px;color:var(--gray3);margin-top:2px}

/* ── 모달 ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:300}
.modal-bg.open{display:flex}
.modal{background:white;border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:20px;animation:slideUp .25s ease;max-height:85vh;overflow-y:auto}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.modal-close{background:none;border:none;font-size:22px;color:var(--gray3);cursor:pointer;line-height:1}
.info-block{background:var(--gray6);border-radius:10px;padding:12px;margin-bottom:12px}
.ib-row{display:flex;justify-content:space-between;margin-bottom:5px}
.ib-row:last-child{margin-bottom:0}
.ib-label{font-size:11px;color:var(--gray3)}
.ib-val{font-size:12px;font-weight:600;color:var(--gray1)}

/* ── 로딩 ── */
.loading{text-align:center;padding:30px;color:var(--gray3)}
.spinner{width:32px;height:32px;border:3px solid #E0E0E0;border-top-color:var(--green2);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 토스트 ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--gray1);color:white;padding:11px 22px;border-radius:22px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.3s;z-index:999;white-space:nowrap;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red2)}
.toast.warn{background:var(--orange2)}

/* ── 섹션 라벨 ── */
.sec-label{font-size:11px;font-weight:700;color:var(--gray3);letter-spacing:.8px;margin-bottom:8px;padding-left:2px}
.alert-banner{background:var(--red3);border:1px solid #FFCDD2;border-radius:10px;padding:10px 13px;margin-bottom:10px;font-size:12px;color:var(--red2);font-weight:600}
.empty{text-align:center;padding:40px 20px;color:var(--gray3)}
.empty-icon{font-size:44px;margin-bottom:8px}

/* ── 날짜 필터 ── */
.filter-row{display:flex;gap:6px;margin-bottom:12px}
.filter-btn{flex:1;padding:8px;border-radius:8px;border:1.5px solid #E0E0E0;background:white;font-size:12px;font-weight:600;color:var(--gray3);cursor:pointer;font-family:inherit;transition:.2s}
.filter-btn.active{border-color:var(--green2);color:var(--green2);background:var(--green4)}
</style>
</head>
<body>

<!-- 헤더 -->
<header>
  <div class="header-top">
    <div class="logo-wrap">
      <div class="logo-badge">
        <span class="logo-daeho">대호</span>
        <span class="logo-co">주식회사</span>
      </div>
      <div class="header-title">
        <h1>영업부 AS 관리</h1>
        <span id="role-label">로딩 중...</span>
      </div>
    </div>
    <div class="role-chip">
      <div class="online-dot"></div>
      <span id="role-name">-</span>
    </div>
  </div>
</header>

<!-- 탭 -->
<div class="tabs" id="tab-bar"></div>

<!-- 컨텐츠 -->
<div class="content" id="main-content">
  <div class="loading"><div class="spinner"></div>불러오는 중...</div>
</div>

<!-- 출고 모달 -->
<div class="modal-bg" id="modal-out">
  <div class="modal">
    <h3>📤 출고 확인 <button class="modal-close" onclick="closeModal('modal-out')">✕</button></h3>
    <div class="info-block" id="modal-out-info"></div>
    <div id="modal-out-parts" style="margin-bottom:12px"></div>
    <p style="font-size:12px;color:var(--gray2);margin-bottom:14px" id="modal-out-msg"></p>
    <button class="btn btn-orange" onclick="doCheckout()">📤 출고 확정</button>
    <button class="btn btn-outline" onclick="closeModal('modal-out')">취소</button>
  </div>
</div>

<!-- AS완료 모달 -->
<div class="modal-bg" id="modal-complete">
  <div class="modal">
    <h3>✅ AS 완료 <button class="modal-close" onclick="closeModal('modal-complete')">✕</button></h3>
    <div class="info-block" id="modal-complete-info"></div>
    <div class="ig"><label>🔍 고장 내용</label><textarea id="complete-fault" rows="2" placeholder="고장 내용 입력"></textarea></div>
    <div class="ig"><label>🔧 수리 내역</label><textarea id="complete-repair" rows="2" placeholder="수리 내역 입력"></textarea></div>
    <div class="ig">
      <label>🔩 사용 부품</label>
      <div class="parts-box" id="complete-parts-list"></div>
      <div class="add-part-row" style="margin-top:8px">
        <input type="text" id="complete-new-part" placeholder="부품 추가">
        <button onclick="addUsedPart()">+ 추가</button>
      </div>
    </div>
    <button class="btn btn-blue" onclick="doComplete()">✅ AS 완료 처리</button>
    <button class="btn btn-outline" onclick="closeModal('modal-complete')">취소</button>
  </div>
</div>

<!-- 강제변경 모달 (부서장) -->
<div class="modal-bg" id="modal-force">
  <div class="modal">
    <h3>⚡ 강제 상태변경 <button class="modal-close" onclick="closeModal('modal-force')">✕</button></h3>
    <div class="info-block" id="modal-force-info"></div>
    <div class="ig">
      <label>변경할 상태</label>
      <select id="force-status">
        <option value="신청">신청</option>
        <option value="대기">대기</option>
        <option value="AS중">AS중</option>
        <option value="완료">완료</option>
        <option value="출고">출고</option>
      </select>
    </div>
    <button class="btn btn-red" onclick="doForceStatus()">⚡ 강제 변경</button>
    <button class="btn btn-outline" onclick="closeModal('modal-force')">취소</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════
// 설정
// ══════════════════════════════════════
const API = 'https://script.google.com/macros/s/AKfycbwErQKIOENh4pd2Cu6lamPuRsvyr9VI5i4lgT8JZm658-sza1-ikNCy0tMQxg9hMnNLtw/exec';

// URL 파라미터로 역할 결정
const params = new URLSearchParams(location.search);
const ROLE = params.get('role') || params.get('team') ? 
  (params.get('role') || 'team' + params.get('team')) : 'admin';
const TEAM = params.get('team') || null;

const ROLE_INFO = {
  chief: { name: '영업부서장', label: '부서장 화면', tabs: ['in','wait','progress','done','stats'] },
  admin: { name: 'Suneth (관리자)', label: '관리자 화면', tabs: ['in','wait','progress','done','stats'] },
  as:    { name: 'AS팀장', label: 'AS팀장 화면', tabs: ['wait','progress','done'] },
  team1: { name: '1팀 팀장', label: '1팀 입고신청', tabs: ['in','myteam'] },
  team3: { name: '3팀 팀장', label: '3팀 입고신청', tabs: ['in','myteam'] },
  team4: { name: '4팀 팀장', label: '4팀 입고신청', tabs: ['in','myteam'] },
  team5: { name: '5팀 팀장', label: '5팀 입고신청', tabs: ['in','myteam'] },
  team6: { name: '6팀 팀장', label: '6팀 입고신청', tabs: ['in','myteam'] },
};
const roleInfo = ROLE_INFO[ROLE] || ROLE_INFO['admin'];

// 전역 상태
let allData = [];
let currentSerial = '';
let usedParts = [];
let currentFilter = 'all';

// ══════════════════════════════════════
// 초기화
// ══════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('role-name').textContent = roleInfo.name;
  document.getElementById('role-label').textContent = roleInfo.label;
  buildTabs();
  loadData();
});

function buildTabs() {
  const tabDefs = {
    in:       { icon:'📥', label:'입고' + (ROLE==='admin'||ROLE==='chief' ? '' : '신청') },
    wait:     { icon:'⏳', label:'AS대기' },
    progress: { icon:'🔧', label:'진행중' },
    done:     { icon:'✅', label:'완료' },
    stats:    { icon:'📊', label:'통계' },
    myteam:   { icon:'👀', label:'우리팀' },
  };
  const bar = document.getElementById('tab-bar');
  bar.innerHTML = '';
  roleInfo.tabs.forEach((t, i) => {
    const d = tabDefs[t];
    const div = document.createElement('div');
    div.className = 'tab' + (i===0?' active':'');
    div.dataset.tab = t;
    div.innerHTML = `<span class="tab-icon">${d.icon}</span>${d.label}`;
    div.onclick = () => switchTab(t);
    bar.appendChild(div);
  });
}

function switchTab(t) {
  document.querySelectorAll('.tab').forEach(tb => tb.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${t}"]`)?.classList.add('active');
  renderScreen(t);
}

// ══════════════════════════════════════
// 데이터 로드
// ══════════════════════════════════════
async function loadData() {
  try {
    let url = API + '?action=getAll';
    const res = await fetch(url);
    const json = await res.json();
    if (json.success) {
      allData = json.data;
      updateBadges();
      renderScreen(roleInfo.tabs[0]);
    } else {
      showToast('데이터 로드 실패: ' + json.error, 'err');
    }
  } catch(e) {
    showToast('연결 오류: ' + e.message, 'err');
  }
}

function updateBadges() {
  const wait = allData.filter(r => r['상태']==='대기').length;
  const prog = allData.filter(r => r['상태']==='AS중').length;
  const waitTab = document.querySelector('.tab[data-tab="wait"]');
  const progTab = document.querySelector('.tab[data-tab="progress"]');
  if (waitTab && wait > 0) {
    let b = waitTab.querySelector('.nbadge') || document.createElement('span');
    b.className = 'nbadge'; b.textContent = wait;
    waitTab.appendChild(b);
  }
  if (progTab && prog > 0) {
    let b = progTab.querySelector('.nbadge') || document.createElement('span');
    b.className = 'nbadge blue'; b.textContent = prog;
    progTab.appendChild(b);
  }
}

// 화면 렌더링
// ══════════════════════════════════════
function renderScreen(tab) {
  const c = document.getElementById('main-content');
  if (tab === 'in')       c.innerHTML = renderIn();
  else if (tab === 'wait')     c.innerHTML = renderWait();
  else if (tab === 'progress') c.innerHTML = renderProgress();
  else if (tab === 'done')     c.innerHTML = renderDone();
  else if (tab === 'stats')    c.innerHTML = renderStats();
  else if (tab === 'myteam')   c.innerHTML = renderMyTeam();
  bindEvents(tab);
}

function renderWait() {

// ─── 통계 ───
function renderStats() {
  const total = allData.length;
  const byStatus = {};
  const byType = {};
  const byTeam = {};
  allData.forEach(r => {
    byStatus[r['상태']] = (byStatus[r['상태']]||0)+1;
    if (r['형식명']) byType[r['형식명']] = (byType[r['형식명']]||0)+1;
    if (r['영업팀']) byTeam[r['영업팀']] = (byTeam[r['영업팀']]||0)+1;
  });
  const completed = allData.filter(r => r['소요일수']>0);
  const avg = completed.length ? (completed.reduce((s,r)=>s+Number(r['소요일수']),0)/completed.length).toFixed(1) : '-';
  const maxType = Math.max(...Object.values(byType), 1);

  return `
  <div class="card">

      <div class="stat-box b"><div class="stat-num">${avg}</div><div class="stat-lbl">평균 소요일</div></div>
      <div class="stat-box o"><div class="stat-num">${byStatus['AS중']||0}</div><div class="stat-lbl">진행중</div></div>
      <div class="stat-box r"><div class="stat-num">${byStatus['대기']||0}</div><div class="stat-lbl">대기중</div></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">🚜 기종별 현황</div>
    ${Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
    <div class="bar-row">
      <span class="bar-label">${k}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/maxType*100)}%;background:var(--green2)">${v}건</div></div>

    ${Object.entries(byTeam).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`

      <span class="bar-label">${k}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/maxTeam*100)}%;background:var(--blue2)">${k}</div></div>

    </div>`).join('')||'<div style="color:var(--gray4);font-size:12px">데이터 없음</div>'}
  </div>

  ${ROLE==='chief'||ROLE==='admin' ? `

// 입고 신청/등록
async function doRegister() {
  const serial = document.getElementById('in-serial')?.value.trim().toUpperCase();
  const model  = document.getElementById('in-model')?.value.trim();
  const type   = document.getElementById('in-type')?.value;
  const team   = TEAM ? TEAM+'팀' : document.getElementById('in-team')?.value;
  const customer = document.getElementById('in-customer')?.value.trim();
  const memo   = document.getElementById('in-memo')?.value.trim();
  const urgent = document.getElementById('in-urgent')?.checked || false;

  if (!serial) { showToast('제조번호를 입력하세요', 'err'); return; }
  if (!type)   { showToast('형식명을 선택하세요', 'err'); return; }

  // 부품 체크 수집
  const partChecks = [];
  document.querySelectorAll('#parts-list .part-item').forEach(item => {
    const cb = item.querySelector('.part-cb');
    const name = item.querySelector('.part-name')?.textContent;
    if (name) partChecks.push(name + (cb?.checked ? '✅' : '☐'));
  });

  showToast('⏳ 신청 중...');
  const res = await postAPI({
    action: 'register', serial, model, type, team, customer, memo,
    urgent, role: ROLE,
    parts: partChecks.join(' / ')
  });
  if (res.success) {
    showToast('✅ ' + res.message);
    document.getElementById('in-serial').value = '';
    loadData();
  } else {
    showToast('❌ ' + res.error, 'err');
  }
}

// 입고 확정 (Suneth)
async function doCheckin(serial) {
  const parts = prompt('부품 체크 내용을 입력하세요\n(예: 조인트✅ 볼트☐ 오일캡✅)') || '';
  showToast('⏳ 처리 중...');
  const res = await postAPI({ action: 'checkin', serial, parts, role: ROLE });
  if (res.success) { showToast('📥 입고 등록 완료!'); loadData(); }
  else showToast('❌ ' + res.error, 'err');
}

// AS 시작 (AS팀장)
async function doStartAS(serial) {
  const manager = prompt('담당 팀장 이름을 입력하세요') || '';
  showToast('⏳ 처리 중...');
  const res = await postAPI({ action: 'startAS', serial, manager, role: ROLE });
  if (res.success) { showToast('🔧 AS 시작!'); loadData(); }
  else showToast('❌ ' + res.error, 'err');
}

// AS 완료 모달 열기
function openComplete(serial) {
  currentSerial = serial;
  usedParts = [];
  const r = allData.find(d => d['제조번호']===serial);
  document.getElementById('modal-complete-info').innerHTML = `
    <div class="ib-row"><span class="ib-label">기계</span><span class="ib-val">${r?.['기종명']||''} ${r?.['형식명']||''}</span></div>
    <div class="ib-row"><span class="ib-label">제조번호</span><span class="ib-val">${serial}</span></div>
    <div class="ib-row"><span class="ib-label">영업팀</span><span class="ib-val">${r?.['영업팀']||'-'}</span></div>`;
  document.getElementById('complete-fault').value = '';
  document.getElementById('complete-repair').value = '';
  document.getElementById('complete-parts-list').innerHTML = `<div style="color:var(--gray4);font-size:12px;padding:6px">+ 버튼으로 사용한 부품을 추가하세요</div>`;
  document.getElementById('modal-complete').classList.add('open');
}

// 사용 부품 추가
function addUsedPart() {
  const name = document.getElementById('complete-new-part').value.trim();
  if (!name) return;
  usedParts.push({ name, qty: 1 });
  renderUsedParts();
  document.getElementById('complete-new-part').value = '';
}

function renderUsedParts() {
  const el = document.getElementById('complete-parts-list');
  if (!usedParts.length) {
    el.innerHTML = `<div style="color:var(--gray4);font-size:12px;padding:6px">+ 버튼으로 사용한 부품을 추가하세요</div>`;
    return;
  }
  el.innerHTML = usedParts.map((p,i) => `
    <div class="used-part-item">
      <span class="part-name">${p.name}</span>
      <button class="qty-btn qty-minus" onclick="changeQty(${i},-1)">−</button>
      <span class="qty-num">${p.qty}</span>
      <button class="qty-btn qty-plus" onclick="changeQty(${i},1)">+</button>
      <span style="font-size:11px;color:var(--gray3)">개</span>
      <button onclick="removeUsedPart(${i})" style="background:none;border:none;color:var(--gray4);font-size:16px;cursor:pointer;padding:0 4px">✕</button>
    </div>`).join('');
}

function changeQty(i, d) {
  usedParts[i].qty = Math.max(1, usedParts[i].qty + d);
  renderUsedParts();
}

function removeUsedPart(i) {
  usedParts.splice(i, 1);
  renderUsedParts();
}

// AS 완료 처리
async function doComplete() {
  const fault  = document.getElementById('complete-fault').value.trim();
  const repair = document.getElementById('complete-repair').value.trim();
  if (!fault)  { showToast('고장 내용을 입력하세요', 'err'); return; }
  if (!repair) { showToast('수리 내역을 입력하세요', 'err'); return; }
  showToast('⏳ 처리 중...');
  const res = await postAPI({ action:'completeAS', serial:currentSerial, fault, repair, usedParts, role:ROLE });
  if (res.success) { showToast('✅ AS 완료!'); closeModal('modal-complete'); loadData(); }
  else showToast('❌ ' + res.error, 'err');
}

// 출고 모달 열기
function openOut(serial) {
  currentSerial = serial;
  const r = allData.find(d => d['제조번호']===serial);
  document.getElementById('modal-out-info').innerHTML = `
    <div class="ib-row"><span class="ib-label">기계</span><span class="ib-val">${r?.['기종명']||''} ${r?.['형식명']||''}</span></div>
    <div class="ib-row"><span class="ib-label">제조번호</span><span class="ib-val">${serial}</span></div>
    <div class="ib-row"><span class="ib-label">영업팀</span><span class="ib-val">${r?.['영업팀']||'-'}</span></div>
    <div class="ib-row"><span class="ib-label">수요자</span><span class="ib-val">${r?.['수요자명']||'-'}</span></div>
    <div class="ib-row"><span class="ib-label">수리내역</span><span class="ib-val">${r?.['수리내역']||'-'}</span></div>`;
  document.getElementById('modal-out-parts').innerHTML = r?.['입고부품체크']
    ? `<div style="background:var(--orange3);border-radius:10px;padding:10px;font-size:12px;color:var(--orange2)">📦 입고 시 부품: ${r['입고부품체크']}</div>`
    : '';
  document.getElementById('modal-out-msg').innerHTML = `출고 처리 후 <strong>${r?.['영업팀']||''}</strong>에 알림됩니다.`;
  document.getElementById('modal-out').classList.add('open');
}

// 출고 확정
async function doCheckout() {
  showToast('⏳ 처리 중...');
  const res = await postAPI({ action:'checkout', serial:currentSerial, role:ROLE });
  if (res.success) {
    showToast(`📤 출고 완료! (소요: ${res.days}일)`);
    closeModal('modal-out');
    loadData();
  } else showToast('❌ ' + res.error, 'err');
}

// 강제 상태변경 (부서장)
function openForce(serial) {
  currentSerial = serial;
  const r = allData.find(d => d['제조번호']===serial);
  document.getElementById('modal-force-info').innerHTML = `
    <div class="ib-row"><span class="ib-label">기계</span><span class="ib-val">${r?.['기종명']||''} ${r?.['형식명']||''}</span></div>
    <div class="ib-row"><span class="ib-label">제조번호</span><span class="ib-val">${serial}</span></div>
    <div class="ib-row"><span class="ib-label">현재상태</span><span class="ib-val">${r?.['상태']||'-'}</span></div>`;
  document.getElementById('force-status').value = r?.['상태']||'대기';
  document.getElementById('modal-force').classList.add('open');
}

async function doForceStatus() {
  const status = document.getElementById('force-status').value;
  showToast('⏳ 처리 중...');
  const res = await postAPI({ action:'forceStatus', serial:currentSerial, status, role:ROLE });
  if (res.success) { showToast('⚡ 상태 변경 완료'); closeModal('modal-force'); loadData(); }
  else showToast('❌ ' + res.error, 'err');
}

// 이력 조회
async function doSearch() {
  const serial = document.getElementById('search-serial').value.trim().toUpperCase();
  if (!serial) { showToast('제조번호를 입력하세요', 'err'); return; }
  const el = document.getElementById('history-result');
  el.innerHTML = '<div class="loading"><div class="spinner"></div>조회 중...</div>';
  try {
    const res = await fetch(`${API}?action=getHistory&serial=${encodeURIComponent(serial)}`);
    const json = await res.json();
    if (!json.success || !json.history.length) {
      el.innerHTML = `<div style="text-align:center;padding:16px;color:var(--gray4);font-size:13px">이력이 없습니다</div>`;
      return;
    }
    el.innerHTML = `
      <div class="history-box">
        <div style="display:flex;justify-content:space-between;margin-bottom:10px">
          <span style="font-size:13px;font-weight:700">${serial}</span>
          <span style="font-size:11px;color:var(--gray3)">총 <strong style="color:var(--blue2)">${json.total}회</strong> AS</span>
        </div>
        ${json.history.map(r => `
        <div class="history-item">
          <div class="history-date">${formatDate(r['신청일시'])}</div>
          <div class="history-content">${r['기종명']||''} ${r['형식명']||''} · <span class="status ${statusClass(r['상태'])}">${r['상태']}</span></div>
          ${r['고장내용'] ? `<div class="history-detail">🔍 ${r['고장내용']}</div>` : ''}
          ${r['수리내역'] ? `<div class="history-detail">🔧 ${r['수리내역']}</div>` : ''}
        </div>`).join('')}
      </div>`;
  } catch(e) {
    el.innerHTML = `<div style="color:var(--red2);font-size:12px;padding:8px">조회 오류: ${e.message}</div>`;
  }
}

// 부품 목록 로드
async function loadParts() {
  const type = document.getElementById('in-type')?.value;
  const sec = document.getElementById('parts-section');
  const list = document.getElementById('parts-list');
  if (!type || !sec || !list) return;
  sec.style.display = 'block';
  list.innerHTML = '<div style="color:var(--gray4);font-size:12px;padding:6px">불러오는 중...</div>';
  try {
    const res = await fetch(`${API}?action=getParts&type=${encodeURIComponent(type)}`);
    const json = await res.json();
    if (json.parts && json.parts.length) {
      list.innerHTML = json.parts.map(p => `
        <div class="part-item">
          <input type="checkbox" class="part-cb">
          <span class="part-name">${p}</span>
        </div>`).join('');
    } else {
      list.innerHTML = `<div style="color:var(--gray4);font-size:12px;padding:6px">${type} 부품 목록 없음 — 아래서 추가하세요</div>`;
    }
  } catch(e) {
    list.innerHTML = `<div style="color:var(--red2);font-size:12px">오류: ${e.message}</div>`;
  }
}

// 새 부품 추가
async function addNewPart() {
  const type = document.getElementById('in-type')?.value;
  const input = document.getElementById('new-part-input');
  const name = input?.value.trim();
  if (!type)  { showToast('형식명을 먼저 선택하세요', 'warn'); return; }
  if (!name)  { showToast('부품명을 입력하세요', 'err'); return; }
  const res = await postAPI({ action:'addPart', type, partName:name });
  if (res.success) {
    showToast('✅ 부품 추가됨');
    if (input) input.value = '';
    loadParts();
  } else showToast('❌ ' + res.error, 'err');
}

// ══════════════════════════════════════
// 유틸
// ══════════════════════════════════════
async function postAPI(body) {
  try {
    const res = await fetch(API, {
      method: 'POST',
      body: JSON.stringify(body)
    });
    return await res.json();
  } catch(e) {
    return { error: e.message };
  }
}

function filterByRole(data) {
  if (TEAM) return data.filter(r => r['영업팀'] === TEAM+'팀');
  return data;
}

function statusClass(s) {
  if (s==='신청') return 's-req';
  if (s==='대기') return 's-wait';
  if (s==='AS중') return 's-ing';
  if (s==='완료') return 's-done';
  if (s==='출고') return 's-out';
  return '';
}

function formatDate(v, short) {
  if (!v) return '-';
  const d = new Date(v);
  if (isNaN(d)) return String(v).substring(0,10);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  const time = d.toTimeString().substring(0,5);
  if (short) return isToday ? `오늘\n${time}` : `${d.getMonth()+1}/${d.getDate()}\n${time}`;
  return isToday ? `오늘 ${time}` : `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${time}`;
}

function setFilter(f) {
  currentFilter = f;
  renderScreen('done');
}

function filterDone() {
  const q = document.getElementById('done-search')?.value.trim();
  showToast(q ? `🔍 "${q}" 검색 중...` : '전체 표시');
}

function bindEvents(tab) {}

function closeModal(id) {
  document.getElementById(id)?.classList.remove('open');
}

let toastTimer;
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type?type+' ':'') + 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className='toast', 2600);
}
</script>
